; Web PocketStation - M5Stack CoreS3 (+ Faces Bottom3 + Gamepad3)
;
;   pio run -t uploadfs            (first time, and whenever you change data/: BIOS, config, cards)
;   pio run -t upload -t monitor   (build + flash the firmware, then show the serial log)

[env:cores3]
platform = espressif32@^6.9.0
board = m5stack-cores3
framework = arduino
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs
board_build.f_cpu = 240000000L
board_upload.flash_size = 16MB
; the CoreS3's USB shows up as /dev/ttyACM0 (never the laptop's built-in /dev/ttyS0)
upload_port = /dev/ttyACM*
monitor_port = /dev/ttyACM*
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
  -O2
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=1
build_unflags = -Os
lib_deps =
  m5stack/M5Unified@^0.2.2
  bblanchon/ArduinoJson@^7.2.0
